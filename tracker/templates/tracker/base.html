<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weather Sentiment — Singapore{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" defer></script>
  <style>
    :root {
      --bg: #0c1220;
      --panel: #141c2e;
      --border: #243049;
      --text: #e8edf7;
      --muted: #8b9bb8;
      --accent: #3b82f6;
      --accent-2: #22c55e;
      --danger: #f87171;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2a4a 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.55;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 2.25rem 1.25rem 3.5rem;
    }
    header.site {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem 2rem;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 46ch;
    }
    .meta {
      text-align: right;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .meta strong { color: var(--text); font-weight: 600; }
    nav.tabs {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    nav.tabs a {
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.03);
    }
    nav.tabs a.active {
      border-color: rgba(59, 130, 246, 0.55);
      background: rgba(59, 130, 246, 0.12);
    }
    .grid {
      display: grid;
      gap: 1.25rem;
    }
    @media (min-width: 900px) {
      .grid.cols-2 { grid-template-columns: 1fr 1fr; }
    }
    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.35rem;
      box-shadow: var(--shadow);
    }
    .card h2 {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .card .caption {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .chart-wrap {
      position: relative;
      height: 280px;
    }
    .empty {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.25rem;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.02);
    }
    .empty strong { color: var(--text); }
    footer.note {
      margin-top: 2rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="shell">
    {% block body %}{% endblock %}
    <footer class="note">
      Sentiment scale: 0 = very unhappy (weather), 4 = neutral, 9 = extremely happy. Data reflects posts matching the configured Singapore-focused search query.
    </footer>
  </div>
</body>
</html>
